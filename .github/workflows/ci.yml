name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so that bit rot in the implementations, in Quicklisp or in
    # the runner images is noticed even when nothing is being pushed.
    - cron: '17 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.lisp }} on ${{ matrix.os }}${{ matrix.deps == 'git' && ' (deps from git)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Experimental jobs report failures without failing the whole build,
    # like Travis' allow_failures used to.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, lisp: sbcl-bin }
          - { os: ubuntu-latest, lisp: ccl }
          - { os: ubuntu-latest, lisp: ecl }
          - { os: ubuntu-latest, lisp: clisp, experimental: true }
          # ABCL has real failures (MISC-TYPES.SIZEOF.{PTRDIFF,SIZE,OFFSET}
          # and TEST-ASDF-LOAD), so it stays experimental for now.
          - { os: ubuntu-latest, lisp: abcl, experimental: true }
          - { os: macos-latest, lisp: sbcl-bin }
          # Tracks the development versions of the libraries CFFI is
          # developed alongside, as the Travis setup used to.
          - { os: ubuntu-latest, lisp: sbcl-bin, deps: git, experimental: true }
          #
          # Combinations that Roswell cannot currently install, and what
          # it would take to bring them back:
          #
          # CCL on macOS: the macos-latest runners are arm64 and there is
          #   no arm64 macOS build of CCL to install -- roswell/ccl_bin
          #   only publishes darwinx86, and upstream has nothing past the
          #   v1.13-arm64-pre1 prerelease.  Needs an Intel runner or an
          #   arm64 release.
          #
          # CMUCL: Roswell's cmu-bin installer asks for a .tar.bz2, but
          #   CMUCL publishes .tar.xz from 21f on, so the download 404s.
          #   Pinning cmu-bin/21e gets a tarball, but CMUCL is 32-bit
          #   x86, so the job would also need gcc-multilib and an i386
          #   libffi for cffi-libffi.
          #
          # Allegro: the express edition is still downloadable, but
          #   `ros install allegro` fails on the runner; it also means
          #   accepting Franz's licence agreement unattended.
    env:
      # Read by scripts/install-for-ci.sh to pick the implementation.
      LISP: ${{ matrix.lisp }}
    steps:
      - uses: actions/checkout@v7

      - name: Install C dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libffi-dev pkg-config
        # macOS: ffi.h comes with the SDK and libffi.dylib with the system.

      - name: Compute cache key
        id: cache-key
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache Roswell and Quicklisp
        uses: actions/cache@v6
        with:
          path: ~/.roswell
          key: roswell-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lisp }}-${{ steps.cache-key.outputs.month }}
          restore-keys: roswell-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lisp }}-

      - name: Install Roswell and ${{ matrix.lisp }}
        run: curl -fsSL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh

      # install-for-ci.sh puts both $GITHUB_WORKSPACE and ~/lisp in ASDF's
      # source registry, so anything cloned here shadows the Quicklisp dist.
      - name: Use development versions of CFFI's dependencies
        if: matrix.deps == 'git'
        run: |
          git clone --depth=1 https://github.com/trivial-features/trivial-features.git ~/lisp/trivial-features
          git clone --depth=1 https://github.com/cl-babel/babel.git ~/lisp/babel
          git clone --depth=1 https://gitlab.common-lisp.net/alexandria/alexandria.git ~/lisp/alexandria

      - name: Run the test suite
        run: |
          extra=()
          if [ "$LISP" = abcl ]; then
            # CFFI's ABCL backend needs JNA, which neither the ABCL
            # distribution nor Roswell ships, and ABCL's own (require :jna)
            # only works where Maven can resolve it.
            curl -fsSL --retry 3 -o "$HOME/jna.jar" \
              https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar
            extra=(-e "(java:add-to-classpath \"$HOME/jna.jar\")")
          fi
          # cffi-tests.asd loads trivial-features while it is being read, so
          # the dependencies have to be there before cffi-tests is quickloaded.
          ros "${extra[@]}" \
              -e '(ql:quickload (list "trivial-features" "babel" "bordeaux-threads" "rt"))' \
              -e '(ql:quickload "cffi-tests")' \
              -e '(uiop:quit (if (cffi-tests:run-all-cffi-tests) 1 0))'
